[project]
name = "golf-game-api"
version = "0.1.0"
description = "Independent Golf multiplayer, game statistics, and global leaderboards"
requires-python = ">=3.11"
dependencies = [
  "flask>=2.2.2,<3.1.0", "werkzeug>=2.2.0,<3.1.0",
  "flask-sqlalchemy>=3.1.0", "psycopg2-binary>=2.9.0",
  "flask-socketio>=5.3.0", "simple-websocket>=1.0.0",
  "flask-cors>=4.0.0", "flask-limiter>=3.5.0", "gunicorn>=21.0.0,<26",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.setuptools.packages.find]
include = ["golf_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
