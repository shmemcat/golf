name: golf

services:
  web:
    image: golf-web-dev:local
    build:
      context: ./web
      dockerfile: Dockerfile.dev
      secrets:
        - fontawesome_token
    ports:
      - "127.0.0.1:${GOLF_PORT:-3003}:3003"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      VITE_BASE_PATH: /
      VITE_ACCOUNT_API_URL: /api/account
      VITE_CARDS_HOME_URL: ${VITE_CARDS_HOME_URL:-http://localhost:3000/}
      ACCOUNT_PROXY_TARGET: ${ACCOUNT_PROXY_TARGET:-http://host.docker.internal:5100}
      GOLF_API_TARGET: ${GOLF_API_TARGET:-http://host.docker.internal:5103}
    command: npm run dev -- --host 0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3003/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  web_node_modules:

secrets:
  fontawesome_token:
    environment: FONTAWESOME_PACKAGE_TOKEN
