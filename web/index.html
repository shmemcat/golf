<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#dfe6da" />
    <meta
      name="description"
      content="Play the classic card game ⛳ Match pairs, swap cards, and aim for the lowest score 🃏"
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg?v=filled-flag" />
    <link
      rel="preload"
      href="%BASE_URL%fonts/Fraunces-Variable.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <title>Golf</title>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Golf" />
    <meta property="og:site_name" content="Cards" />
    <meta property="og:url" content="https://cards.shmem.dev/golf/" />
    <meta
      property="og:description"
      content="Play the classic card game ⛳ Match pairs, swap cards, and aim for the lowest score 🃏"
    />
    <meta
      property="og:image"
      content="https://cards.shmem.dev/golf/images/og-image.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Sage green golf flag above the name Golf in ivory on a dark green background."
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Golf" />
    <meta
      name="twitter:description"
      content="Play the classic card game ⛳ Match pairs, swap cards, and aim for the lowest score 🃏"
    />
    <meta
      name="twitter:image"
      content="https://cards.shmem.dev/golf/images/og-image.png"
    />
    <meta
      name="twitter:image:alt"
      content="Sage green golf flag above the name Golf in ivory on a dark green background."
    />

    <script>
      try {
        const saved = JSON.parse(localStorage.getItem("cards.theme.v1"));
        document.documentElement.dataset.theme =
          saved === "light" || saved === "dark"
            ? saved
            : matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
      } catch {
        document.documentElement.dataset.theme = matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches
          ? "dark"
          : "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
